spring:
  application:
    name: user-service
  cloud:
    config:
      fail-fast: true
  config:
    import:
      optional:configserver:http://localhost:8888
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
server:
  forward-headers-strategy: framework
